name: Tests

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      with:
        version: '0.10.5'
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --group dev

    - name: Install Chromium for UI regression tests
      run: uv run --locked python -m playwright install --with-deps chromium

    - name: Run unit tests
      run: uv run --locked python -m scripts.ci.tests

    - name: Verify backup and peer regressions as root with isolated state
      run: |
        sudo "$PWD/.venv/bin/python" - <<'PY'
        import os, tempfile, unittest
        with tempfile.TemporaryDirectory(prefix='backup-root-tests-') as state:
            os.environ.update(DATA_FILE=state + '/data.json',
                              SSH_KNOWN_HOSTS_FILE=state + '/known_hosts',
                              TUNNEL_STATE_FILE=state + '/tunnels.json',
                              SECRET_KEY='isolated-ci-fixture')
            suite = unittest.defaultTestLoader.discover('tests', pattern='test_panel_backup.py')
            for pattern in ('test_rknblock_app.py', 'test_server_page_render.py', 'test_destructive_accounting_guards.py'):
                suite.addTests(unittest.defaultTestLoader.discover('tests', pattern=pattern))
            result = unittest.TextTestRunner(verbosity=2).run(suite)
            if not result.wasSuccessful():
                raise SystemExit(1)
        PY
